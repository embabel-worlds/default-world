<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 316" role="img"
     aria-labelledby="t d" width="560" height="316">
  <title id="t">Illustration: starting Claude Code against this appliance</title>
  <desc id="d">A drawing of a terminal running the claude command and asking the world which
    realms are installed. An illustration of the shape of the session, not a captured
    screenshot.</desc>

  <!--
    SHIPPED AS A FILE, SERVED BY THIS APPLIANCE, at /apps/world/tour-claude-code.svg. That is the
    whole constraint: a tour is a document people exchange, so an image it names must come from the
    reader's own machine. Nothing here is fetched — no remote font, no raster, no external asset.

    SVG rather than a PNG because the honest artefact IS a drawing. Nobody's terminal is being
    photographed here; the step happens in a shell this app cannot see, and what the reader needs
    is the SHAPE of it — one command, one question, a tool call coming back. A screenshot would
    claim more than that: a version, a theme, a working directory, an exact rendering of somebody
    else's product that is wrong the week they change it. The caption in coding-agent.yml says
    "roughly what you will see" for the same reason.
  -->

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .dim  { fill: #8b949e; }
      .txt  { fill: #d8dee9; }
      .cmd  { fill: #ffffff; font-weight: 600; }
      .ok   { fill: #7ee787; }
      .acc  { fill: #d2a8ff; }
      .you  { fill: #79c0ff; }
    </style>
  </defs>

  <rect width="560" height="316" rx="10" fill="#0d1117"/>

  <!-- Window chrome. Enough to read as "a terminal", not a facsimile of any one of them. -->
  <rect width="560" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="560" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5" fill="#febc2e"/>
  <circle cx="56" cy="17" r="5" fill="#28c840"/>
  <text x="280" y="22" class="mono dim" font-size="12.5" text-anchor="middle">~/my-world</text>
  <line x1="0" y1="34" x2="560" y2="34" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="68" class="mono"><tspan class="ok">$</tspan><tspan class="cmd" dx="10">claude</tspan></text>

  <!-- The welcome banner, reduced to the two facts that matter to a reader of this tour. -->
  <rect x="24" y="84" width="512" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="42" y="106" class="mono"><tspan class="acc">✻</tspan><tspan class="txt" dx="10">Welcome to Claude Code</tspan></text>
  <text x="42" y="126" class="mono dim" font-size="13">MCP server <tspan class="txt">embabel</tspan> · connected <tspan class="ok">✔</tspan></text>

  <text x="24" y="170" class="mono"><tspan class="you">&gt;</tspan><tspan class="cmd" dx="10">what realms are installed?</tspan></text>

  <text x="24" y="206" class="mono"><tspan class="acc">⏺</tspan><tspan class="txt" dx="10">embabel · realm_status</tspan></text>
  <text x="44" y="230" class="mono dim" font-size="13.5">3 realms installed — uk-streets, oss-health, night-sky</text>

  <text x="24" y="266" class="mono"><tspan class="you">&gt;</tspan><tspan class="cmd" dx="10">create me a realm for a data source I care about</tspan></text>
  <rect x="24" y="278" width="9" height="18" fill="#79c0ff" opacity="0.85"/>
</svg>
