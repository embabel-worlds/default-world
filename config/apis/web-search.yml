# Web search — universally available in every chat. Brave Search's REST
# API (vendored OpenAPI spec at brave.yaml) provides web and news search
# the LLM reaches for when the user asks "who is <public-figure>",
# "latest news on X", or otherwise needs current information beyond what
# the knowledge graph holds. Replaces the former brave-search Docker MCP
# server — same capability, no container.
#
# Requires `BRAVE_API_KEY` in the world credential store or the
# environment (free tier sufficient for personal use; sign up at
# https://api.search.brave.com/). If the key is missing the API is
# skipped at load time — no other chat behaviour is affected.
#
# The research realm declares the same API under the same `brave` name,
# so each works without the other. API names are one namespace across the
# world and its realms; a later declaration that is the SAME API (same
# spec content, servers, auth, token-env, capability-tags and every other
# field that shapes a call) is that API, loaded once with no problem. This
# world-tier entry is learned first, so it holds the `brave` gateway
# namespace and its credential. If the two ever differ in any of those,
# the realm's copy is a different API: it is loaded as `brave_research`
# and the realm reads degraded with a problem naming the fields that
# differ. So keep this entry and brave.yaml identical to realm-research's
# — change one, change the other.
#
# `capability-tags` declares what this API IS FOR, so code that has to
# pick a search tool without an LLM in the loop — person research, for
# one — finds it by capability rather than by the provider's name. Any
# entry declaring `web-search` is discovered the same way, so replacing
# Brave with another provider keeps web research working. This is NOT
# `tags`, which filters which OPERATIONS of a spec become tools.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY
  capability-tags: [web-search]
