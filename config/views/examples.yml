# Named views — saved Cypher bodies referenced in a query by NAME as a plain label, expanded to a leading
# CALL {} subquery (no Cypher grammar change). See docs/plans/virtual-cypher-views.md.
#
# A view here must be a SUBSET view: `MATCH … [WHERE …] RETURN <singleNodeVar>` — its rows ARE nodes of an
# existing (real or virtual) type, so it preserves identity and composes:
#   MATCH (d:my_documents) WHERE 'contracts' IN d.tags RETURN d.title
# expands to
#   CALL { MATCH (me:AssistantUser)<-[:OWNED_BY]-(d:Document) RETURN d AS d } MATCH (d) WHERE 'contracts' IN d.tags RETURN d.title
#
# A view that ships with every world reads only what every world has. Views over correspondence (the
# EMAILED edge) and over the assistant's own memory (:Proposition) ship with the inbox realm,
# embabel-worlds/realm-email, because a world without mail has neither and would list them only to
# refuse them.
- name: my_documents
  description: "Documents you own — a subset of Document."
  cypher: |
    MATCH (me:AssistantUser)<-[:OWNED_BY]-(d:Document) RETURN d
