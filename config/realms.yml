# Default realms. Each entry is a git repo, cloned once into the appliance's shared realm cache.
#
# NOT A ONE-TIME SEED. The server reads this file as a live tier under every world's own
# realms.yml, merged by name, so a realm ADDED here arrives in every existing world once the
# appliance's copy of default-world is updated. Taking one OUT reaches only new worlds: an existing
# world's clone has its own realms.yml listing what was here when it was made. Add with that in
# mind — a default realm must be keyless and quick to answer, because everybody gets it.
- name: research
  repo: https://github.com/embabel-worlds/realm-research.git
  version: "main"
- name: github
  repo: https://github.com/embabel-worlds/realm-github.git
  version: "main"
- name: spec
  repo: https://github.com/embabel-worlds/realm-spec.git
  version: "main"
# Street-level Britain from keyless official sources. A default because it answers on an empty
# world — its national views (DistrictCrimeLeague and the like) need no place set up first — and it
# ships a tour written for exactly that state. Its first national query fetches a few small ONS and
# gov.uk files; nothing large is downloaded at install.
- name: uk-streets
  repo: https://github.com/embabel-worlds/realm-uk-streets.git
  version: "main"
# THE MEMORY REALMS ARE OPT-IN. Each is one more system under the shared Memory label
# (types/memory.yml), and on a new machine none of them has anything to read: Omnigraph and Graphiti
# need servers an appliance does not run, and markdown and MCP memory read folders that start
# empty. As defaults they made every "what do you remember" question ask four sources that could
# not answer. Install one from the Realms window in a world that has what it reads:
#   https://github.com/embabel-worlds/realm-omnigraph-memory   an Omnigraph server
#   https://github.com/embabel-worlds/realm-graphiti-memory    a Graphiti server
#   https://github.com/embabel-worlds/realm-markdown-memory    notes under the world's data/memory/
#   https://github.com/embabel-worlds/realm-mcp-memory         an MCP memory server's memory.jsonl
#   https://github.com/embabel-worlds/realm-zep-memory         a ZEP_API_KEY and a Zep user id
