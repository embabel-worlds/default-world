# THE PLATFORM TOUR, not a realm's — how somebody actually gets a coding agent working on this
# world. It is the tour with the most at stake and the least to do, and both of those are the point.
#
# THE APPLIANCE IS ALREADY WIRED. `wire_coding_agents()` runs during setup, on the host, and does
# `claude mcp add --transport http --scope user embabel <code door> --header "Authorization:
# Bearer …"` with a token minted once in that process. So by the time anybody reads this, the
# registration exists and the only thing left is to START the agent. An earlier draft of this tour
# opened the Connect panel and pressed "Wire Claude Code", which is redundant work on something
# setup already did — and worse, it implies to a user who IS set up that they are not.
#
# WHAT THE APPLIANCE CANNOT KNOW is whether `claude mcp add` ran: registration lives in
# `~/.claude.json`, on the user's disk, not in the graph. What it does know is whether an agent has
# ever COMPLETED A HANDSHAKE at the code door — which is the better fact anyway, because
# registered-but-never-started is precisely the state this tour exists to move somebody out of.
#
# So the important step happens in a TERMINAL, which is not this app and must not be. A tour cannot
# type into somebody's shell, and reaching for the accessibility tree to do it would be the wrong
# trade — a permission grant and a script that rots on the next redesign of an app we do not own.
# It hands over instead, and because the hand-over declares a precondition, the world answers for
# the user: the tour carries on by itself the instant the agent connects. Nobody is at this window
# to press Done.
#
# `surface: all` — it names no panel this console lacks. The one fallback that WOULD need a panel
# (re-wiring by hand) is narration, not a step, precisely so this runs everywhere.

- id: FirstCodingAgent
  name: Put a coding agent to work
  surface: all
  description: >-
    Your appliance is already registered with Claude Code. This is the two minutes that turns
    that into a realm — and the tour waits while you are in your terminal.

  steps:
    - say: |
        This appliance is meant to be **built on**, and the thing that builds on it is a coding
        agent talking to your world over MCP — reading the graph, writing to it, and authoring
        realms, views and handlers without anybody hand-editing YAML.

        **Setup already registered it.** `claude mcp add` ran during install, pointed at this
        world's code door, with a token minted for you. There is nothing to configure.

    - open: panel.realms
      say: |
        This is what your agent will be changing. Whatever it builds arrives here — same directory,
        same lifecycle, and `embabel realms` removes it the same way anything else goes.

    # THE PICTURE, and it goes HERE rather than on the step below, for two reasons that are really
    # the same one. A `say` on a hand-over step lands AFTER the user comes back, so an illustration
    # of the place they were going would arrive once they had been; and a hint is painted as plain
    # text on purpose, because it is an instruction and not prose. So the last thing they see
    # before leaving is a step of its own.
    #
    # It is a DRAWING and says so. The shape is what transfers — one command, a connected server,
    # a question answered by a tool call. A screenshot would additionally claim a version, a theme
    # and a working directory, and be wrong the week any of those changed.
    #
    # `/apps/world/...` is this appliance's own app store, and the sanitizer deletes an image from
    # anywhere else. That rule is not incidental: tours are files people exchange, and an image on
    # a host the author controls would quietly report every reader who opened one.
    - say: |
        One terminal window, and you are done. Roughly what it looks like:

        ![A terminal running claude against this world](/apps/world/tour-claude-code.svg)

        Two lines: `claude` to start it, then ask in English. The `embabel` server is the one
        setup registered — your world, answering as you.

    # THE POINT OF THIS FILE. The step happens somewhere this app cannot see, so the world watches
    # for it instead. A handshake at the CODE door specifically: a chat client saying hello is not
    # this, which is why the query names the door rather than counting connections.
    - open: panel.realms
      by: user
      hint: >-
        Open a terminal, run `claude`, and ask it "what realms are installed?" — I will notice by
        myself when it connects, so you can leave this window alone.
      doneWhen: |
        MATCH (me:AssistantUser)-[:HAS_CONFIG]->(d:ConfigMcpDoor {name: 'code'})
        WHERE d.everConnected
        RETURN d
      say: |
        **Connected.** That was the appliance noticing, not you telling it — the world knew the
        moment your agent completed a handshake at the code door.

        (If it never connects: the Coding Agents panel has the command to register it by hand, for
        an agent on another machine or an install where you said no at the prompt.)

    - say: |
        Now ask it for something real:

        > *Create me an Embabel realm for a data source I care about.*

        It starts at `realm_brief`, writes with `realm_write`, checks with `realm_validate` and
        puts the result in this world with `realm_install`. Eighty-odd tools, and those four are
        the loop.

        One thing to know first: **realm authoring needs DEVELOPER mode.** In `ASSISTANT` mode an
        agent sees your data and nothing else — the right default, and not the one you want here.
        Coding Agents has the switch.

    - say: |
        The boundary, stated plainly, because you are handing an agent the keys.

        It talks to **your** world, through the code door, as you. It can read the graph and write
        configuration. It cannot reach anything this appliance cannot already reach — and
        everything it builds is a file in a directory you can read, review and delete.
