# The tour every world ships with — the walk a first-time user is offered.
#
# A TOUR IS NOT A NEXT STEP. `next-steps/getting-started.yml` beside this file asks one question
# each and stands aside; a tour narrates, fills fields, runs views, and hands control back at the
# steps that are the user's to do. They are meant to sit together: a step says "save a view you will
# ask again", and a tour is how somebody who has never seen a view is walked through saving one.
#
# `surface: all` because every target named here is in BOTH dictionaries — the Me app's panels and
# the console's tabs. A tour that reaches for something only one surface has should say so
# (`surface: me`), and one that names it anyway is refused by the other with the target in the
# message, which is the whole point of publishing a dictionary.
#
# ON `doneWhen`. It is Cypher over the config catalog, run as the user, and a row means "already
# satisfied, skip this step". Write it against the world as it IS, never against what somebody
# clicked: that is what lets a user pause at step three, come back tomorrow, and be walked from
# four rather than made to redo the first three.

- id: FirstQuestion
  name: Ask your world a question
  surface: all
  description: >-
    The shortest path from an empty-looking app to an answer that came out of your own data —
    what is here, how to ask it something, and where the answer came from.

  params:
    question:
      ask: "What would you like to ask? (anything — 'what do I know about?' works)"

  steps:
    - say: |
        Welcome. This appliance holds a **knowledge graph** of your own material: documents you
        point it at, and whatever the realms you install bring with them. Nothing here is uploaded
        anywhere — the graph, the search and the embeddings all run on this machine.

        Let's ask it something.

    - open: panel.realms
      say: |
        **Realms** are how a world learns about a system you already run — a data source, an API,
        a set of documents. Each one brings types, queries and sometimes scheduled jobs, and takes
        them away again when you remove it.

    # THE TOUR BRANCHES ON WHAT IS HERE. `when` is a positive precondition: the step runs only
    # when the query returns a row. The documents leg applies when at least one document is
    # indexed; the other leg applies when none is. Without the branch this tour submitted the
    # question to Documents on an empty appliance, got "No answer was produced", and then
    # congratulated the user on an answer assembled from their material (me#1131).
    - open: panel.documents
      when: MATCH (d:Document) RETURN d LIMIT 1
      say: |
        **Documents** is the other half. Anything you index here is converted, chunked and embedded
        locally, and becomes searchable alongside everything the realms know.

    - set: field.question
      when: MATCH (d:Document) RETURN d LIMIT 1
      to: "{{ question }}"

    - invoke: button.ask
      when: MATCH (d:Document) RETURN d LIMIT 1
      say: Asking now — the first question on a cold appliance can take a moment.

    - wait: state.documents.answered
      when: MATCH (d:Document) RETURN d LIMIT 1
      timeout: 3m
      meanwhile: Searching your own material and composing an answer.
      else: >-
        No answer came back in three minutes. That usually means the model provider key has not
        been set — it is on the Machine panel.

    - say: |
        That answer was assembled from your own material, and every claim in it can be traced back
        to the chunk it came from. Ask it something else whenever you like.
      when: MATCH (d:Document) RETURN d LIMIT 1

    # The other leg: nothing is indexed, so Documents has nothing to answer from. The realms are
    # the data here, and the way to ask them is chat — which routes a question to the saved view
    # that answers it, or writes a query when none does.
    - open: panel.documents
      doneWhen: MATCH (d:Document) RETURN d LIMIT 1
      say: |
        **Documents** is the other half — anything you index here is converted, chunked and
        embedded locally. Nothing is indexed yet, so there is nothing for this panel to answer
        from; drop a file here whenever you like. Your realms are the data on this appliance, and
        they answer through chat.

    - open: panel.chat
      doneWhen: MATCH (d:Document) RETURN d LIMIT 1
      say: |
        Ask your question here. Chat checks the saved views your realms ship — each one answers a
        question its author wrote down — and runs the one that fits, or writes a query when none
        does. The sources it used appear under the answer.

    - open: panel.query
      by: user
      hint: "Open Query when you are ready — it is in the tab strip."
      say: |
        One last thing worth seeing. **Query** is the same knowledge, without the prose: virtual
        Cypher over your world, where a question you will ask again can be saved as a named view
        and become part of this world's vocabulary — for you, and for any agent working here.
