# A cached summary of one of YOUR documents — materialized on first traversal of
# (d:Document)-[:HAS_SUMMARY]->(s:Summary), persisted in the graph (cache kind graph on the producer),
# and served from there with zero model calls while the document's chunks are unchanged. One node per
# (document, wordcount band): gist (~40 words), standard (~200, the directive-free default), long (~600).
#   MATCH (:Concept {value:'inspection'})-[:RELEVANT_TO]->(d:Document)
#   MATCH (d)-[:HAS_SUMMARY]->(s:Summary) RETURN s.summary
#   MATCH (d:Document {uri:'…'})-[:HAS_SUMMARY {ai: {wordcount: 40}}]->(s:Summary) RETURN s.summary
- name: Summary
  visibility: internal
  userAnchor: false
  description: "THE way to summarize a document's CONTENT: a summary of one of YOUR ingested documents, generated on demand from the document's full text and cached in the graph per wordcount band. Reach it ONLY from a bound Document via HAS_SUMMARY — e.g. MATCH (d:Document …)-[:HAS_SUMMARY]->(s:Summary) RETURN s.summary. Pick a length with {ai: {wordcount: 40}} (gist) or 600 (long) on the edge; the default is ~200 words. {ai: {fresh: true}} forces regeneration. Always prefer this edge over calling summarize() on document properties — they are metadata, not content."
  virtualJoins:
    - anchorLabel: Document
      relationship: HAS_SUMMARY
      keyField: uri
      recordKeyField: docUri
      producer: docSummary
      description: "THE route for 'summarize document X' or any question about a document's overall CONTENT: an on-demand, graph-cached summary of the document's full text — RETURN s.summary. Pick a length ON THIS EDGE with {ai: {wordcount: 40}} (short/gist) or {ai: {wordcount: 600}} (long); default ~200 words; {ai: {fresh: true}} regenerates. A Document node carries only metadata, so NEVER summarize(d.title) / summarize(d.uri) — titles are not content. Repeats serve the cached summary until the document changes."
  # FEW-SHOT for the text-to-cypher generator (lens path): "summarize document X" must traverse the
  # HAS_SUMMARY edge, NEVER call summarize() over document metadata (a title/uri is not content — that
  # collapses to the honest-miss sentinel at runtime). Synthetic 'acme' placeholders only.
  examples:
    - q: "summarize my document about acme"
      cypher: |
        MATCH (:Concept {value:'acme'})-[:RELEVANT_TO]->(d:Document)
        MATCH (d)-[:HAS_SUMMARY]->(s:Summary)
        RETURN s.summary AS summary
    - q: "give me a 40 word summary of my report about acme"
      cypher: |
        MATCH (:Concept {value:'acme'})-[:RELEVANT_TO]->(d:Document)
        MATCH (d)-[:HAS_SUMMARY {ai: {wordcount: 40}}]->(s:Summary)
        RETURN s.summary AS summary
  properties:
    id:
      description: "Synthesized identity — producer:owner:documentUri:band. One node per (document, band)."
      metadata:
        identity: "true"
    docUri: "URI of the summarized document (= the anchor's uri)."
    summary: "The summary text at this node's band."
    band: "Wordcount band: gist (~40), standard (~200, default), long (~600)."
    count: "How many chunks were reduced."
    generatedAt: "When this summary was generated (ISO-8601)."
