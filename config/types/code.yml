# CODE — the parent labels every language's code realm shares, the way `Memory` is shared by every
# memory system. A realm brings one language (realm-java-code reads jars, realm-java-source their
# source; a language read from source alone, through the `source-tree` kind, has the source parents
# and no compiled ones) and declares its own children — `JavaMethod` with `parents: [Method]` — over its own
# producers. Ancestors are physically present (LABELS_AND_COMPOSITION §2), so a query may name the
# parent and be answered by every language that has a join, or name a child to read one language:
#
#   MATCH (j:Jar {path: $jar})-[:HAS_METHOD]->(m:Method)       -- whatever language the realm reads
#   MATCH (j:Jar {path: $jar})-[:HAS_METHOD]->(m:JavaMethod)   -- Java alone
#
# These declare the CONTRACT only: the properties every language's rows carry under these names. A
# child adds its language's own (a Java field's `genericType`, a Java type's `hashCodeFrom`) and may
# not drop these. None declares a join; the language realms do. Nothing here is stored — code is
# read from the artifact or the source when a query reaches it.
#
# Two key properties tie the halves together: `sourceKey` names the source file a member compiled
# from, and `spanKey` one line of it with the name that line should show. A source realm keys on
# them, so compiled code reaches its source without either realm knowing the other's producers.

- name: Package
  description: "A package or namespace of compiled code. Name a language's child (e.g. JavaPackage) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    name: "Dotted package name."
    types: { type: int, description: "Types the package holds in that artifact." }

- name: CodeType
  description: "A class, interface, enum, record or similar type in compiled code, from any language. `name` is the runtime name a stack trace or heap dump prints. Name a language's child (e.g. JavaType) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    name: "The type's runtime (binary) name."
    simpleName: "The name without package or enclosing type."
    packageName: "Dotted package name."
    kind: "class, interface, enum, record, annotation, … as the language has them."
    sourceFile: "The source file name the compiled type records, when it records one."
    sourceKey: "Key of the source file it compiled from; what a source realm joins on."

- name: Field
  description: "A field (member variable) declared by a type in compiled code, from any language. Name a language's child (e.g. JavaField) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    key: "Owner type's name, a dot, the field name."
    owner: "Runtime name of the declaring type."
    name: "Field name."
    type: "Runtime name of the declared type, erased."
    isStatic: { type: boolean, description: "Belongs to the type rather than an instance." }
    sourceKey: "Key of the source file it compiled from."

- name: Method
  description: "A method, constructor or initializer declared by a type in compiled code, from any language. Name a language's child (e.g. JavaMethod) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    key: "Owner type's name, a dot, the method name and its parameter types."
    owner: "Runtime name of the declaring type."
    name: "Method name, as the runtime names it."
    kind: "method, constructor, static-initializer, …"
    line: { type: int, description: "First source line, from debug information; 0 when unknown." }
    sourceKey: "Key of the source file it compiled from."
    spanKey: "Key of its first source line; what a source realm joins on."

- name: Call
  description: "Calls from one method to one target method, grouped: one row per (caller, callee) with the lines. The callee may be anywhere — the same artifact, the platform, another library. Name a language's child (e.g. JavaMethodCall) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    caller: "Key of the calling method."
    callerOwner: "Runtime name of the calling type."
    callee: "Key of the called method."
    calleeOwner: "Runtime name of the called type."
    calleeName: "Name of the called method."
    lines: { cardinality: LIST, description: "Source lines of the calls." }
    count: { type: int, description: "How many call sites." }
    spanKey: "Key of the first call's source line."
    resolution: "How the callee was identified, as CallSite has it; compiled code gives `exact`."

- name: FieldAccess
  description: "Reads or writes of one field by one method, grouped: one row per (method, field, READ|WRITE) with the lines. Name a language's child (e.g. JavaFieldAccess) to read one language."
  properties:
    id: { identity: true, description: "Unique within the artifact it was read from." }
    method: "Key of the method that touches the field."
    field: "Key of the field."
    access: "READ or WRITE."
    lines: { cardinality: LIST, description: "Source lines of the accesses." }
    count: { type: int, description: "How many access sites." }
    spanKey: "Key of the first access's source line."

- name: Source
  description: "A source file, read where it is: beside the artifact it compiled into, in a project folder or mounted checkout, or in a git repository at a commit. Name a language's child (e.g. JavaSource) to read one language."
  properties:
    id: { identity: true, description: "The root it was found in, `!`, its path there." }
    root: "Where it was found: a folder, a -sources.jar, or `host/repo@commit`."
    path: "Path within the root."
    language: "java, kotlin, typescript, python, …"
    lines: { type: int, description: "Line count." }
    sha256: "Hash of the file's bytes."
    commit: "The commit it was read at, for a git root."
    url: "Where to view it on the web, when the root's host has a file view."

- name: SourceSpan
  description: "A window of numbered source lines around one line — the code at a method, a call or a field access. `matches` is false when the name the compiled code expects is not on those lines: the source is not the artifact's version."
  properties:
    id: { identity: true, description: "The file's id, `#`, the line range." }
    sourceId: "Id of the Source it is part of."
    line: { type: int, description: "The line asked for." }
    fromLine: { type: int, description: "First line of the window." }
    toLine: { type: int, description: "Last line of the window." }
    text: "The lines, each prefixed with its number."
    name: "The name the compiled code expects on the line."
    matches: { type: boolean, description: "The expected name appears in the window." }
    url: "The line on the web, for a git root on a known host."

- name: SourceDeclaration
  description: "A declaration in a source file's syntax tree — a type, field, constructor, method, function, variable or initializer — with its exact extent and full text. Name a language's child (e.g. JavaDeclaration) to read one language."
  properties:
    id: { identity: true, description: "The file's id, `#`, the kind, name and first line." }
    sourceId: "Id of the Source it is in."
    kind: "class, interface, enum, record, annotation, field, constructor, method, function, variable, initializer, as the language has them."
    name: "Declared name."
    owner: "Runtime name of the declaring type; empty for a top-level function or variable, or inside an anonymous or local class."
    fromLine: { type: int, description: "First line, annotations and doc comment excluded." }
    toLine: { type: int, description: "Last line." }
    text: "The declaration's numbered lines (not for a whole type)."
    signature: "As source writes it."
    javadoc: "The documentation comment's description, when there is one: a Javadoc, a JSDoc, a docstring."

- name: CallSite
  description: "One call in source, from a file's syntax tree: what it is called on and what is passed, with each argument's static type where the file alone shows it. Name a language's child (e.g. JavaCallSite) to read one language."
  properties:
    id: { identity: true, description: "The file's id, `#call@`, line and column." }
    sourceId: "Id of the Source it is in."
    line: { type: int, description: "Line of the call." }
    method: "Called method's name, or the class name for a constructor call."
    receiver: "What it is called on, as written; empty for an unqualified call."
    receiverType: "Runtime name of the receiver's static type, when the file shows it."
    arguments: { cardinality: LIST, description: "Each argument as written." }
    argumentTypes: { cardinality: LIST, description: "Each argument's static type, when the file shows it; empty when it does not." }
    enclosing: "Name of the member the call is in."
    resolution: "How far the callee is known. `exact`: the method itself (compiled code, or a resolving parser). `type`: the receiver's static type is known and the method is matched by name within it. `name`: only the name, so any method of that name may be the callee. A syntax-only reader gives `name`."

- name: SourceImport
  description: "One import in a source file: what the file brings in from another module, package or file, as written. Name a language's child (e.g. JavaImport) to read one language."
  properties:
    id: { identity: true, description: "The file's id, `#import@`, the line and column." }
    sourceId: "Id of the Source it is in."
    line: { type: int, description: "Line of the import." }
    module: "The module, package or file imported from, as written: `java.util`, `@angular/core`, `./order`, `os.path`."
    names: { cardinality: LIST, description: "The names brought in, as written; empty when the whole module is (`import os`, `import * as fs`)." }
    alias: "The local name the module is bound to, when the import gives one (`import numpy as np`)."
    isStatic: { type: boolean, description: "A static import, or the language's equivalent." }

- name: SourceLocal
  description: "A local variable in a source file's syntax tree — a plain local, a loop variable, a resource, a pattern binding — with its type as written and what it is given. Name a language's child (e.g. JavaLocal) to read one language."
  properties:
    id: { identity: true, description: "The file's id, `#local:`, the name, line and column." }
    sourceId: "Id of the Source it is in."
    kind: "local, for, foreach, resource, pattern."
    name: "Variable name."
    line: { type: int, description: "Line of the declaration." }
    declaredType: "The type as written; the language's inference keyword (`var`) when the type is inferred."
    initializer: "What it is given, as written; empty when nothing is."
    initializerType: "Runtime name of the initializer's static type, when the file shows it."
    enclosing: "Name of the member it is declared in."
    text: "The declaration's numbered lines."

- name: StackFrame
  description: "One frame of a stack trace: the method running, and the file and line it names. Carries the compiled-code keys when an artifact the world holds compiled its type, so it reaches the type, the method's declaration and the source lines. Name a language's child (e.g. JavaStackFrame) to read one language."
  properties:
    id: { identity: true, description: "The trace's id, `#`, the throwable's index and the frame's." }
    traceId: "Id of the trace: the same text, the same id."
    exception: "Runtime name of the throwable whose frames these are."
    frame: { type: int, description: "Position in its throwable's frames, 0 at the top." }
    className: "Runtime name of the frame's type."
    method: "Method name, as the runtime names it."
    file: "Source file the frame names; empty when it names none."
    line: { type: int, description: "Line the frame names; empty when it names none." }
    inArtifact: { type: boolean, description: "An artifact the world holds compiled the frame's type." }
    sourceKey: "Key of the source file, when an artifact compiled the type."
    spanKey: "Key of the frame's source line; what a source realm joins on."
    text: "The frame as printed."

- name: ThrownException
  description: "One throwable in a stack trace — the one thrown, a cause, or one it suppressed — with its message and where its frames first reach code an artifact the world holds compiled. Name a language's child (e.g. JavaThrowable) to read one language."
  properties:
    id: { identity: true, description: "The trace's id, `#`, its index in the trace." }
    traceId: "Id of the trace."
    index: { type: int, description: "Position in the trace: 0 is the one thrown." }
    relation: "thrown, cause or suppressed."
    exception: "Runtime name of the throwable's type."
    message: "Its message."
    isRootCause: { type: boolean, description: "The last cause in the chain." }
    spanKey: "Key of the source line of its first frame in held code."
