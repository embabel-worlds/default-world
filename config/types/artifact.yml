# ARTIFACTS — the parent labels every package ecosystem's realm shares, as code.yml's are for code. A
# realm brings one ecosystem (Maven through the `maven` and `jar` kinds, npm through deps.dev) and
# declares its own children — `ProjectDependency` with `parents: [Dependency]` — over its own
# producers. A query naming the parent is answered by every ecosystem that has a join:
#
#   MATCH (p {key: $project})-[:DEPENDS_ON]->(d:Dependency) WHERE d.direct   -- whatever builds it
#
# `Package` (code.yml) is a code namespace, a Java package; the published, versioned unit that npm and
# Maven also call a package is an `Artifact` here, so the two never share a name.
#
# These declare the CONTRACT only: the properties every ecosystem's rows carry under these names. A
# child adds its ecosystem's own (Maven's `scope` and `optional`, npm's `bundled`) and may not drop
# these. None declares a join; the ecosystem realms do. Nothing here is stored.
#
# `name` and `version` are the ecosystem's own spelling, so a row's `ecosystem`, `name` and `version`
# together name one published unit, and the same unit read by two realms has the same three values.

- name: Artifact
  description: "A built, versioned, published unit: a Maven jar, an npm or PyPI package version. Name an ecosystem's child (e.g. JavaArtifact) to read one ecosystem."
  properties:
    id: { identity: true, description: "Unique within what it was read from." }
    ecosystem: "maven, npm, pypi, cargo, go, … in lower case."
    name: "The ecosystem's name for it, without the version: `groupId:artifactId` for Maven, the package name for npm (`@scope/name` when scoped)."
    version: "The exact version."

- name: Dependency
  description: "One artifact a module or package depends on, at the version resolution settled on, not the range it asked for. Name an ecosystem's child (e.g. ProjectDependency) to read one ecosystem."
  properties:
    id: { identity: true, description: "Unique within what it was read from; two dependents' copies of the same artifact are two rows." }
    ecosystem: "maven, npm, pypi, cargo, go, … in lower case."
    name: "The dependency's name, as Artifact's."
    version: "The resolved version."
    direct: { type: boolean, description: "Declared by the dependent itself, rather than reached through another dependency." }
    scope: "When it is needed, in the ecosystem's words (compile, runtime, test; dev, peer, optional); empty where the ecosystem has none."

- name: Licence
  description: "The licences one published version is distributed under, as its ecosystem records them. Name an ecosystem's child (e.g. NpmLicence) to read one ecosystem."
  properties:
    id: { identity: true, description: "Unique within what it was read from." }
    ecosystem: "maven, npm, pypi, cargo, go, … in lower case."
    name: "The artifact's name, as Artifact's."
    version: "The version the licences are for."
    licences: { cardinality: LIST, description: "SPDX identifiers, or the names as recorded when there is none. A list because dual licensing is a choice; EMPTY means none is recorded, which is not 'none applies'." }
